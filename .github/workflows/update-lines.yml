name: Update CFB lines

on:
  schedule:
    # Line updates: every 3 hours, Mon-Sat (UTC). Adjust to taste -- lines
    # move most Sun night/Mon (open) and Thu-Sat (close).
    - cron: "0 */3 * * 1-6"
    # Weekly seed: Sunday 19:00 UTC (~3pm ET). The AP Top 25 releases around
    # 2pm ET Sundays (Coaches Poll ~1pm ET), sometimes running 15-30 min
    # late -- this leaves a real buffer so the reseed reliably picks up the
    # fresh poll instead of the previous week's. This is its own schedule
    # entry specifically so the seed-games job below can identify it and
    # only run then.
    - cron: "0 19 * * 0"
    # Settle bets: Sunday 17:00 UTC (~1pm ET), well after Saturday's games
    # (including primetime) have finished and CFBD has posted final scores,
    # and before the reseed above -- closes out the finishing week before
    # opening the next one. Also runs again alongside the reseed as a
    # catch-all for any late-finalizing scores.
    - cron: "0 17 * * 0"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Only one run of this workflow active at a time. Without this, repeated
# manual triggers (e.g. during troubleshooting) can pile up as queued runs
# and eat your account's concurrent-job limit, which is what makes a later
# run sit stuck in "Queued" for no obvious reason. A new run now cancels
# whatever's still in flight instead of queuing behind it.
concurrency:
  group: update-cfb-lines
  cancel-in-progress: true

jobs:
  seed-games:
    # Runs only on the Sunday reseed cron above, or when triggered manually.
    if: github.event.schedule == '0 19 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Seed this week's Top 25 + notable games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        # No --week flag: seed_games.py auto-detects the current week from
        # CFBD's calendar. Pass --week explicitly if you ever need to backfill
        # a specific week by hand.
        run: python scripts/seed_games.py --year ${{ vars.SEASON_YEAR }}

  fetch-lines:
    # Explicitly waits for seed-games, even on runs where seed-games gets
    # skipped by its own `if:` (a skipped dependency still counts as
    # satisfied). Without this, GitHub runs both jobs in parallel, which on
    # a manual trigger can race against seed-games mid-reseed and fetch
    # lines against gameIds that are about to change.
    needs: seed-games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch Hard Rock + reference lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python scripts/fetch_lines.py

  settle-bets:
    # Runs on either Sunday cron above (settle time itself, or alongside
    # the reseed as a catch-all), or when triggered manually. Independent
    # of seed-games/fetch-lines -- it only reads existing bets/games plus
    # CFBD's final scores, so there's no ordering dependency either way.
    if: github.event.schedule == '0 17 * * 0' || github.event.schedule == '0 19 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Settle pending bets against final scores
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python scripts/settle_bets.py --year ${{ vars.SEASON_YEAR }}

# NOTE: a manual "Run workflow" click (workflow_dispatch) runs all three
# jobs, seed-games first (per `needs:` on fetch-lines), then fetch-lines
# and settle-bets. That's fine for testing -- a manual run just does
# everything at once instead of waiting for its normal day.
