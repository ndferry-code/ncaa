name: Update CFB lines

on:
  schedule:
    # Line updates: every 3 hours, Mon-Sat (UTC). Adjust to taste -- lines
    # move most Sun night/Mon (open) and Thu-Sat (close).
    - cron: "0 */3 * * 1-6"
    # Weekly seed: Monday 13:00 UTC (~9am ET), after the new AP poll and
    # schedule are out. This is its own schedule entry specifically so the
    # seed-games job below can identify it and only run then.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Only one run of this workflow active at a time. Without this, repeated
# manual triggers (e.g. during troubleshooting) can pile up as queued runs
# and eat your account's concurrent-job limit, which is what makes a later
# run sit stuck in "Queued" for no obvious reason. A new run now cancels
# whatever's still in flight instead of queuing behind it.
concurrency:
  group: update-cfb-lines
  cancel-in-progress: true

jobs:
  seed-games:
    # Runs only on the Monday cron above, or when triggered manually.
    if: github.event.schedule == '0 13 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Seed this week's Top 25 + notable games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        # No --week flag: seed_games.py auto-detects the current week from
        # CFBD's calendar. Pass --week explicitly if you ever need to backfill
        # a specific week by hand.
        run: python scripts/seed_games.py --year ${{ vars.SEASON_YEAR }}

  fetch-lines:
    # Explicitly waits for seed-games, even on runs where seed-games gets
    # skipped by its own `if:` (non-Monday cron -- a skipped dependency still
    # counts as satisfied). Without this, GitHub runs both jobs in parallel,
    # which on a manual trigger can race against seed-games mid-reseed and
    # fetch lines against gameIds that are about to change (this bit Week 0
    # specifically, since its IDs get freshly rewritten by the opening-batch
    # split logic on every seed run).
    needs: seed-games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch Hard Rock + reference lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python scripts/fetch_lines.py

# NOTE: a manual "Run workflow" click (workflow_dispatch) runs both jobs,
# seed-games first (per the `needs:` above), then fetch-lines. That's fine --
# it just means a manual test run also reseeds the current week's games
# before pulling lines, which is the correct order anyway.
